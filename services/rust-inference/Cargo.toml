# ==============================================================================
# Cargo Workspace Configuration (services/rust-inference/Cargo.toml)
# Shared Rust Workspace for High-Performance Cloud-Native Model Inference
# ==============================================================================

[workspace]
members = [
    "crates/traffic-contract",
    "crates/traffic-tree-engine",
    "crates/traffic-onnx-engine",
    "crates/traffic-inference",
    "crates/traffic-api",
]
resolver = "2"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rayon = "1.8"
tokio = { version = "1.35", features = ["full"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1.0"
chrono = { version = "0.4", features = ["serde"] }
