# ==============================================================================
# Apache Spark Defaults Configuration (config/spark-defaults.conf)
# Central Spark Engine Configuration Settings
# ==============================================================================

# Default Spark Master URL endpoint
spark.master                     spark://spark-master:7077

# Default Spark Application Name
spark.app.name                   traffic-prediction

# Memory allocation for Spark Driver process
spark.driver.memory              2g

# Memory allocation for Spark Executor processes
spark.executor.memory            2g

# Default timezone for date and timestamp operations
spark.sql.session.timeZone       UTC

# Default compression codec for Parquet data output
spark.sql.parquet.compression.codec snappy

# Default Filesystem URI pointing to HDFS NameNode
spark.hadoop.fs.defaultFS        hdfs://namenode:9000
