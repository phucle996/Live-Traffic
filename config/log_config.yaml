# ==============================================================================
# Logging Configuration Specification (YAML)
# Structured Logger Setup supporting standard Console and Cloud-Native JSON Formats
# ==============================================================================

version: 1
disable_existing_loggers: False

formatters:
  standard: # Standard human-readable console log format with timestamps
    format: "%(asctime)s [%(levelname)s] %(name)s (%(filename)s:%(lineno)d): %(message)s"
    datefmt: "%Y-%m-%d %H:%M:%S"

  json: # Cloud-native structured JSON format for log collection (Loki / Fluentd / ELK)
    format: '{"time":"%(asctime)s", "level":"%(levelname)s", "logger":"%(name)s", "file":"%(filename)s", "line":%(lineno)d, "message":"%(message)s"}'
    datefmt: "%Y-%m-%dT%H:%M:%SZ"

handlers:
  console: # Stream handler pointing to standard output (stdout)
    class: logging.StreamHandler
    level: INFO
    formatter: standard
    stream: ext://sys.stdout

root: # Root logger definition
  level: INFO
  handlers: [console]
