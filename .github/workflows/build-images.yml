# ==============================================================================
# Build & Push Docker Images Workflow (.github/workflows/build-images.yml)
# RULE: Docker image tags are ALWAYS the immutable Git SHA — NEVER :latest
# Runs only after ci job passes (needs: [ci])
# ==============================================================================

name: Build & Push Docker Images

on:
  push:
    branches: [main]

jobs:
  build-images:
    name: Build, Scan & Push Docker Images
    runs-on: ubuntu-latest
    needs: [ci]   # GATE: CI pipeline must fully pass before building images
    timeout-minutes: 30

    env:
      # Immutable image tag — Git SHA ensures every image is uniquely traceable
      IMAGE_TAG: ${{ github.sha }}
      REGISTRY: ghcr.io/${{ github.repository_owner }}

    steps:
      # Step 1: Checkout repository at the exact commit being built
      - name: Checkout code
        uses: actions/checkout@v4

      # Step 2: Log in to GitHub Container Registry using GITHUB_TOKEN secret
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Step 3: Set up Docker Buildx for multi-platform builds
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Step 4: Build and push Prediction API image
      # Tag format: ghcr.io/owner/traffic-prediction-api:{git-sha}
      # NEVER uses :latest tag — enforced by not providing :latest alias
      - name: Build and push prediction-api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.api
          push: true
          tags: |
            ${{ env.REGISTRY }}/traffic-prediction-api:${{ env.IMAGE_TAG }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Step 5: Trivy image scan AFTER build — block push if HIGH/CRITICAL CVE found
      - name: Trivy image vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "${{ env.REGISTRY }}/traffic-prediction-api:${{ env.IMAGE_TAG }}"
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-results.sarif

      # Step 6: Generate Software Bill of Materials (SBOM)
      - name: Generate SBOM
        run: bash scripts/generate_sbom.sh "${{ env.IMAGE_TAG }}"

      # Step 7: Upload SBOM and Trivy SARIF as build artifacts for auditing
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ env.IMAGE_TAG }}
          path: sbom.json

    # ci job must be in the same workflow file or called via workflow_call
    # For simplicity, reference the inline ci job below
  ci:
    name: CI Pipeline (referenced)
    uses: ./.github/workflows/ci.yml
