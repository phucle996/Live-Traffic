# ==============================================================================
# Prometheus Monitoring Server Configuration (monitoring/prometheus/prometheus.yml)
# ==============================================================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - "rules/infrastructure.yml"
  - "rules/pipeline.yml"
  - "rules/model.yml"

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'prediction_api'
    static_configs:
      - targets: ['streamlit:8000', 'localhost:8000']

  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']
