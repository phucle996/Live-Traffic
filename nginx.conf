# ==============================================================================
# NGINX Ingress Router Gateway Configuration (nginx.conf)
# Cloud-Native Reverse Proxy Routing Requests to Rust, Go Live API, and Web Dashboard
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Sử dụng Docker Embedded DNS Resolver (127.0.0.11) giúp NGINX tự động cập nhật IP của container khi restart/deploy lại
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Cấu hình Upstream backend trong mạng nội bộ docker (traffic-net)
    upstream rust_inference_backend {
        server rust-inference-api:8080 max_fails=3 fail_timeout=10s;
    }

    upstream go_live_api_backend {
        server go-live-api:8084 max_fails=3 fail_timeout=10s;
    }

    upstream web_dashboard_backend {
        server web-dashboard:8501 max_fails=3 fail_timeout=10s;
    }

    server {
        listen 80;
        server_name localhost;

        # 1. Route điều hướng cho Rust Inference API (Dự đoán AI tốc độ)
        location /v1/predictions {
            proxy_pass http://rust_inference_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/model {
            proxy_pass http://rust_inference_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route điều hướng cho Go Live Traffic API & Source Status
        location /v1/traffic {
            proxy_pass http://go_live_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/source {
            proxy_pass http://go_live_api_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route mặc định cho Web Dashboard Static Frontend SPA
        location / {
            proxy_pass http://web_dashboard_backend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

