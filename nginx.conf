# ==============================================================================
# NGINX Ingress Router Gateway Configuration (nginx.conf)
# Cloud-Native Reverse Proxy Routing Requests to Rust, Go Live API, and Web Dashboard
# ==============================================================================

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    keepalive_timeout 65;

    # Sử dụng Docker Embedded DNS Resolver (127.0.0.11) tự động cập nhật IP container mỗi 5 giây
    resolver 127.0.0.11 valid=5s ipv6=off;

    server {
        listen 80;
        server_name localhost;

        # Định nghĩa các biến URL trỏ đến backend container (Buộc NGINX re-resolve DNS linh hoạt, tránh 502 Bad Gateway khi container restart)
        set $rust_inference_url "http://rust-inference-api:8080";
        set $go_live_api_url    "http://go-live-api:8084";
        set $web_dashboard_url  "http://web-dashboard:8501";

        # 1. Route điều hướng cho Rust Inference API (Dự đoán AI tốc độ)
        location /v1/predictions {
            proxy_pass $rust_inference_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/model {
            proxy_pass $rust_inference_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 2. Route điều hướng cho Go Live Traffic API & Source Status
        location /v1/traffic {
            proxy_pass $go_live_api_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /v1/source {
            proxy_pass $go_live_api_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 3. Route mặc định cho Web Dashboard Static Frontend SPA
        location / {
            proxy_pass $web_dashboard_url;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}

