# ==============================================================================
# ServiceAccount + RBAC (deploy/kubernetes/service-account.yaml)
# Dedicated ServiceAccount for prediction API pods with minimal permissions
# Principle of Least Privilege: no cluster-admin, no wildcard verbs
# ==============================================================================

apiVersion: v1
kind: ServiceAccount
metadata:
  name: traffic-prediction-sa
  namespace: production
  labels:
    app: traffic-prediction
  # Disable automounting of default service account token (use explicit token only)
automountServiceAccountToken: false

---
# Role: allows API pods to read their own ConfigMap and Secrets
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: traffic-prediction-role
  namespace: production
rules:
  # Allow reading ConfigMaps (non-secret config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list"]
  # Allow reading Secrets (e.g., TLS certs, API key secrets)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  # Allow reading own pod metadata (for leader election, if needed)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

---
# RoleBinding: bind Role to the ServiceAccount
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: traffic-prediction-rolebinding
  namespace: production
subjects:
  - kind: ServiceAccount
    name: traffic-prediction-sa
    namespace: production
roleRef:
  kind: Role
  name: traffic-prediction-role
  apiGroup: rbac.authorization.k8s.io
