# ==============================================================================
# HorizontalPodAutoscaler (deploy/kubernetes/hpa.yaml)
# Scales API pods between 3–12 based on CPU utilization target of 60%
# min=3 ensures HA baseline even during low traffic
# ==============================================================================

apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: traffic-prediction-api-hpa
  namespace: production
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: traffic-prediction-api
  # Never scale below 3 — maintains HA even at zero traffic
  minReplicas: 3
  # Cap at 12 to prevent runaway scale-out costs
  maxReplicas: 12
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          # Scale out when average CPU across all pods exceeds 60%
          type: Utilization
          averageUtilization: 60
    - type: Resource
      resource:
        name: memory
        target:
          # Also scale on memory pressure (useful for ML model inference)
          type: Utilization
          averageUtilization: 75
  behavior:
    scaleDown:
      # Stabilize scale-down over 5 minutes to avoid flapping
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 60
    scaleUp:
      # Scale up faster — 2 pods per 30s during traffic spikes
      stabilizationWindowSeconds: 30
      policies:
        - type: Pods
          value: 2
          periodSeconds: 30
